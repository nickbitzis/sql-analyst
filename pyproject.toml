[project]
name = "sqlanalyst"
version = "1.0.0"
description = "A Claude agent that answers business questions with read-only SQL, plus guardrails and an execution-accuracy eval."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
sqlanalyst = "sqlanalyst.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
